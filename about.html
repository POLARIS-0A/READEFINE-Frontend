  <style>

    /* PINALAKI AT PINAGANDANG GLASSMORPHISM MODALS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(23, 75, 133, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      width: 90%;
      max-width: 480px;
      padding: 44px 40px;
      box-shadow: 0 25px 50px rgba(23, 75, 133, 0.15);
      text-align: center;
      position: relative;
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .close-modal-btn {
      position: absolute;
      top: 22px;
      right: 24px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border-subtle, #E2E8F0);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text-dark, #1E293B);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .close-modal-btn:hover {
      background: #FFFFFF;
      transform: scale(1.05);
    }
    .auth-logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--deep-blue, #174B85);
      margin-bottom: 16px;
      display: inline-block;
    }
    .auth-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--deep-blue, #174B85);
      margin-bottom: 8px;
    }
    .auth-subtitle {
      color: var(--text-muted, #64748B);
      font-size: 1rem;
      margin-bottom: 32px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--deep-blue, #174B85);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 16px 18px;
      background: rgba(250, 252, 255, 0.95);
      border: 1px solid var(--border-subtle, #E2E8F0);
      border-radius: 16px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text-dark, #1E293B);
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--soft-blue, #8DB8EE);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(141, 184, 238, 0.25);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--deep-blue, #174B85);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 12px;
      box-shadow: 0 8px 20px rgba(23, 75, 133, 0.2);
    }
    .btn-submit:hover {
      background: #113866;
      transform: translateY(-2px);
    }
    .auth-footer-text {
      font-size: 0.95rem;
      color: var(--text-muted, #64748B);
      margin-top: 24px;
    }
    .auth-footer-text a {
      color: var(--deep-blue, #174B85);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-footer-text a:hover {
      text-decoration: underline;
    }
    
  </style>
</head>
