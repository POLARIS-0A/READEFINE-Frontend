<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READEFINE - Read. Learn. Redefine.</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>

    body{
      display: block;
      height: auto;
      min-height: 100vh;
      overflow-x: auto;
      overflow-y: auto;
    }

    /* PINALAKI AT PINAGANDANG GLASSMORPHISM MODALS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(23, 75, 133, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex;
    }

    .hero-card{
      background-image: linear-gradient(to bottom,  transparent 70%,  #EAF2FF), url(ASSETS/aboutus-bg.jpg);
      border: none;
      background-size: cover;
      background-position: center;
      position: relative;
      min-height: clamp(260px, 42vw, 480px);
      padding: clamp(24px, 6vw, 64px) 16px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    .hero-card h1, .hero-card p{
        color: #FFFFFF;
        text-align: center;
    }

    .hero-text{
      position: relative;
      width: min(100%, 760px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
        justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .hero-card h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .hero-card p {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
    }

    @media (max-width: 480px) {
      .hero-card {
      min-height: 240px;
      padding: 28px 20px;
      }
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      width: 90%;
      max-width: 480px;
      padding: 44px 40px;
      box-shadow: 0 25px 50px rgba(23, 75, 133, 0.15);
      text-align: center;
      position: relative;
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .close-modal-btn {
      position: absolute;
      top: 22px;
      right: 24px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border-subtle, #E2E8F0);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text-dark, #1E293B);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .close-modal-btn:hover {
      background: #FFFFFF;
      transform: scale(1.05);
    }
    .auth-logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--deep-blue, #174B85);
      margin-bottom: 16px;
      display: inline-block;
    }
    .auth-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--deep-blue, #174B85);
      margin-bottom: 8px;
    }
    .auth-subtitle {
      color: var(--text-muted, #64748B);
      font-size: 1rem;
      margin-bottom: 32px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--deep-blue, #174B85);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 16px 18px;
      background: rgba(250, 252, 255, 0.95);
      border: 1px solid var(--border-subtle, #E2E8F0);
      border-radius: 16px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text-dark, #1E293B);
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--soft-blue, #8DB8EE);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(141, 184, 238, 0.25);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--deep-blue, #174B85);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 12px;
      box-shadow: 0 8px 20px rgba(23, 75, 133, 0.2);
    }
    .btn-submit:hover {
      background: #113866;
      transform: translateY(-2px);
    }
    .auth-footer-text {
      font-size: 0.95rem;
      color: var(--text-muted, #64748B);
      margin-top: 24px;
    }
    .auth-footer-text a {
      color: var(--deep-blue, #174B85);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-footer-text a:hover {
      text-decoration: underline;
    }
    
    .profile-deck{
        position: relative;
        width: min(100%, 300px);
        height: 400px;
        margin: 0 auto;
    }

    .profile-card{
        position:absolute;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        background: #FFFFFF;
        border: 1px solid var(--border-subtle, #E2E8F0);
        border-radius: 16px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.1);
        display: grid;
        align-items: center;
        justify-content: center;
        transition: transform 650ms cubic-bezier(0.22, 1, 0.36, 1), background-color 200ms ease, box-shadow 200ms ease;
        transform-origin: bottom center;
    }
    .profile-deck:hover .c1{
        transform: rotate(-30deg) translate(-100px,-20px);
    }

    .profile-deck:hover .c2{
        transform: rotate(-10deg) translate(-50px,-10px);
    }

    .profile-deck:hover .c3{
        transform: rotate(5deg) translate(-10px, -10px);
    }

    .profile-deck:hover .c4{
        transform: rotate(30deg) translate(30px,-10px);
    }

    .profile-card:hover{
        scale: 1.01;
        background-image: linear-gradient(to bottom,#FFFFFF,#FFFFFF,#8DB8EE) !important;
        text-decoration: underline;
        z-index: 10 !important; 
    }

    .profile-card img{
        width: min(200px, 100%);
        aspect-ratio: 1;
        height: auto;
        border-radius: 100%;
        object-fit: cover;
        object-position: center;
        justify-self: center;
    }

    .profile-text{
        width: min(250px, 100%);
        text-align: center;
        overflow-wrap: anywhere;
    }

    @media (max-width: 700px), (hover: none) {
      .profile-deck {
        display: grid;
        width: min(100%, 300px);
        height: 360px;
        margin: 0 auto;
      }

      .profile-card {
        left: 16px;
        width: calc(100% - 32px);
        position: absolute;
        min-height: 320px;
        height: 100%;
        padding: 24px 16px;
      }

      .profile-deck:hover .c1,
      .profile-deck.is-expanded .c1 {
        transform: rotate(-4deg) translate(-8px, -6px);
      }

      .profile-deck:hover .c2,
      .profile-deck.is-expanded .c2 {
        transform: rotate(-2deg) translate(-4px, -3px);
      }

      .profile-deck:hover .c3,
      .profile-deck.is-expanded .c3 {
        transform: rotate(1deg) translate(0, -2px);
      }

      .profile-deck:hover .c4,
      .profile-deck.is-expanded .c4 {
        transform: rotate(4deg) translate(8px, -6px);
      }

      .profile-card:hover {
        scale: 1.01;
        background-image: linear-gradient(to bottom,#FFFFFF,#FFFFFF,#8DB8EE) !important;
        text-decoration: underline;
        z-index: 10 !important; 
      }

      .profile-card img {
        width: clamp(120px, 42vw, 180px);
      }

      .profile-text h2 {
        font-size: clamp(1.1rem, 5vw, 1.5rem);
      }
    }
   
  
  </style>
</head>
<body>

  <div class="app-frame">
    <div class="landing-container">
      
      <!-- Top Navigation -->
      <nav class="landing-nav">
        <div class="landing-logo">
          <img src="ASSETS/logo.png">  READEFINE
        </div>
        <ul class="landing-nav-links">
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="levels.html">Lessons</a></li>
          <li><a href="exams.html">Exams</a></li>
          <!-- Direct nang pumupunta sa dashboard/progress page -->
          <li><a href="progress.html">Progress</a></li>
        </ul>
        
      </nav>

      <!-- Center Hero Oblong Card -->
      <div class="hero-card">
        <div class="hero-text">
          <h1>BROUGHT TO YOU BY: POLARIS-0A</h1>
          <p><i>Young minds, Bright ideas.</i></p>
      </div>
  </div>

  <h1 style = "text-align: center; margin: 20px 0;">READEFINE's Developers</h1>

  <div class="profile-deck" role="group" tabindex="0" aria-label="Developer cards. Press Enter or Space to spread or stack the cards." aria-expanded="false">
    <div class = "profile-card c1" style="z-index: 1;">
        <img src="ASSETS/prof-pic-1.jpg">
        <div class="profile-text">
            <h2>JUDELYN BUYAGON</h2>
            <p>BACK-END DEVELOPER</p>
        </div>
    </div>

    <div class = "profile-card c2" style="z-index: 1;">
        <img src="ASSETS/prof-pic-1.jpg">
        <div class="profile-text">
            <h2>KIRSTEN CAMPOY</h2>
            <p>FULLSTACK DEVELOPER</p>
        </div>
    </div>

    <div class = "profile-card c3" style="z-index: 2;">
        <img src="ASSETS/prof-pic-1.jpg">
        <div class="profile-text">
            <h2>ALLISA LUALHATI</h2>
            <p>FRONT-END DEVELOPER</p>
        </div>
    </div>

    <div class = "profile-card c4" style="z-index: 1;">
        <img src="ASSETS/prof-pic-1.jpg">
        <div class="profile-text">
            <h2>LESLIE MAALA</h2>
            <p>GRAPHIC DESIGNER</p>
        </div>
    </div>
  </div>


  <script>
    const profileDeck = document.querySelector(".profile-deck");
    const toggleProfileDeck = () => {
      const isExpanded = profileDeck.classList.toggle("is-expanded");
      profileDeck.setAttribute("aria-expanded", String(isExpanded));
    };

    profileDeck.addEventListener("click", toggleProfileDeck);
    profileDeck.addEventListener("keydown", (event) => {
      if (event.target === profileDeck && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        toggleProfileDeck();
      }
    });
  </script>

</body>
</html>
